<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1104px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · as run on the lens story, 2026-10-06/07</p>
    <h1>Story pipeline: message first, looks second, on a solid back end</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1104 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
        <title id="pipeline-title">Story pipeline</title>
        <desc id="pipeline-desc">A story's message is written and storyboarded first, then built and checked, then shipped only on the owner's word; every stage reads a shared factory of contracts and rules, and the review writes its lessons back into that factory.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Band labels: the three things the pipeline is about, in his order. -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.14em">
          <line x1="20"  y1="52" x2="388"  y2="52" stroke="#bfc0c0" stroke-width="0.8"/>
          <line x1="484" y1="52" x2="852"  y2="52" stroke="#bfc0c0" stroke-width="0.8"/>
          <line x1="948" y1="52" x2="1084" y2="52" stroke="#bfc0c0" stroke-width="0.8"/>
          <rect x="140" y="46" width="128" height="12" fill="#f5f5f5"/><text x="204" y="55" text-anchor="middle">1 · THE MESSAGE</text>
          <rect x="590" y="46" width="156" height="12" fill="#f5f5f5"/><text x="668" y="55" text-anchor="middle">2 · THE LOOK, CHECKED</text>
          <rect x="968" y="46" width="96" height="12" fill="#f5f5f5"/><text x="1016" y="55" text-anchor="middle">3 · SHIPPED</text>
        </g>

        <!-- Arrows first. Stage handoffs, each carrying the check that passes it. -->
        <g stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
          <line x1="156" y1="116" x2="252" y2="116"/>
          <line x1="388" y1="116" x2="484" y2="116"/>
          <line x1="620" y1="116" x2="716" y2="116"/>
        </g>
        <line x1="852" y1="116" x2="948" y2="116" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <!-- Write-back loop: the review improves the factory (G8 came from the lens review). -->
        <line x1="784" y1="160" x2="784" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels: opaque mask, 6px clear of the stroke. -->
        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">
          <rect x="162" y="92" width="84" height="12" fill="#f5f5f5"/><text x="204" y="101" fill="#4f5d75">SKIMS CAPTIONS</text>
          <rect x="394" y="92" width="84" height="12" fill="#f5f5f5"/><text x="436" y="101" fill="#4f5d75">READS BEATS</text>
          <rect x="626" y="92" width="84" height="12" fill="#f5f5f5"/><text x="668" y="101" fill="#4f5d75">VERIFY GATES</text>
          <rect x="858" y="92" width="84" height="12" fill="#f5f5f5"/><text x="900" y="101" fill="#eb6c36">WATCH + "PUSH"</text>
          <rect x="792" y="180" width="80" height="12" fill="#f5f5f5"/><text x="832" y="189" fill="#4f5d75">WRITES BACK</text>
        </g>

        <!-- Stage nodes: 01 script -->
        <rect x="20" y="72" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="20" y="72" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="28" y="80" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="38" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
        <text x="88" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Script</text>
        <text x="88" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lens-script.md</text>
        <text x="88" y="144" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">what it says, in captions</text>

        <!-- 02 storyboard -->
        <rect x="252" y="72" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="252" y="72" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="260" y="80" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="270" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
        <text x="320" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Storyboard</text>
        <text x="320" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lens-storyboard.md</text>
        <text x="320" y="144" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one beat per idea, holds named</text>

        <!-- 03 build -->
        <rect x="484" y="72" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="484" y="72" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="492" y="80" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="502" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
        <text x="552" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build</text>
        <text x="552" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lens-v2.html</text>
        <text x="552" y="144" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">own session; orchestrator lean</text>

        <!-- 04 review (focal) -->
        <rect x="716" y="72" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="72" width="136" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="724" y="80" width="20" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="734" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
        <text x="784" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review</text>
        <text x="784" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lens-review.md · verdict.md</text>
        <text x="784" y="144" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">asserts · stills · lag · watch</text>

        <!-- 05 publish -->
        <rect x="948" y="72" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="948" y="72" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="956" y="80" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="966" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
        <text x="1016" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Publish</text>
        <text x="1016" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lens_story_v2.html</text>
        <text x="1016" y="144" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">URL must answer 200</text>

        <!-- Back end: contracts + factory, read by every stage (layout says so; no five arrows). -->
        <rect x="20" y="216" width="1064" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="20" y="216" width="1064" height="56" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <text x="552" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Back end: a contract per stage, one factory for every story — read by all five, improved by each review</text>
        <text x="552" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CONTEXT.md × 5 · _shared/ engine rules G1–G8 (G8 = lens review's lesson) · draw-cost-probe.js · _templates/</text>

        <!-- Legend: one horizontal strip -->
        <line x1="20" y1="296" x2="1084" y2="296" stroke="#bfc0c0" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" letter-spacing="0.04em">
          <rect x="20" y="312" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
          <text x="44" y="322">THE CHECK THAT DECIDES A SHIP</text>
          <line x1="352" y1="318" x2="388" y2="318" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="396" y="322">ARROW LABEL = WHO PASSES THE STAGE</text>
          <line x1="712" y1="318" x2="748" y2="318" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="756" y="322">DOWN = REVIEW WRITES A RULE INTO THE FACTORY</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
