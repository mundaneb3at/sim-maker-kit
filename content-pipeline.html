<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1104px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Proposed · the story pipeline applied to image and video</p>
    <h1>Content pipeline: research first, then the same message-first checks</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1104 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="content-pipeline-title content-pipeline-desc">
        <title id="content-pipeline-title">Content pipeline</title>
        <desc id="content-pipeline-desc">A research step scans trends and picks one idea into a brief; the brief's message then runs through the same five checked stages as the story pipeline (message, shot list, generate, review, publish), with brand rules and a prompt library read by every stage and improved by each review.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Band labels: research on top, then the story pipeline's three bands. -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.14em">
          <line x1="20"  y1="52"  x2="388"  y2="52"  stroke="#bfc0c0" stroke-width="0.8"/>
          <rect x="148" y="46" width="112" height="12" fill="#f5f5f5"/><text x="204" y="55" text-anchor="middle">1 · RESEARCH</text>
          <line x1="20"  y1="212" x2="388"  y2="212" stroke="#bfc0c0" stroke-width="0.8"/>
          <line x1="484" y1="212" x2="852"  y2="212" stroke="#bfc0c0" stroke-width="0.8"/>
          <line x1="948" y1="212" x2="1084" y2="212" stroke="#bfc0c0" stroke-width="0.8"/>
          <rect x="140" y="206" width="128" height="12" fill="#f5f5f5"/><text x="204" y="215" text-anchor="middle">2 · THE MESSAGE</text>
          <rect x="590" y="206" width="156" height="12" fill="#f5f5f5"/><text x="668" y="215" text-anchor="middle">3 · THE LOOK, CHECKED</text>
          <rect x="968" y="206" width="96" height="12" fill="#f5f5f5"/><text x="1016" y="215" text-anchor="middle">4 · SHIPPED</text>
        </g>

        <!-- Arrows first. Research handoff, the brief dropping into stage 01, then the stage handoffs. -->
        <g stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
          <line x1="156" y1="116" x2="252" y2="116"/>
          <path d="M 320 160 V 176 A 8 8 0 0 1 312 184 H 96 A 8 8 0 0 0 88 192 V 232"/>
          <line x1="156" y1="276" x2="252" y2="276"/>
          <line x1="388" y1="276" x2="484" y2="276"/>
          <line x1="620" y1="276" x2="716" y2="276"/>
        </g>
        <line x1="852" y1="276" x2="948" y2="276" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <!-- Write-back loop: each review improves the brand rules and prompt library. -->
        <line x1="784" y1="320" x2="784" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels: opaque mask, 6px clear of the stroke. -->
        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">
          <rect x="162" y="92"  width="84" height="12" fill="#f5f5f5"/><text x="204" y="101" fill="#4f5d75">PICKS ONE IDEA</text>
          <rect x="162" y="164" width="84" height="12" fill="#f5f5f5"/><text x="204" y="173" fill="#4f5d75">ONE MESSAGE</text>
          <rect x="162" y="252" width="84" height="12" fill="#f5f5f5"/><text x="204" y="261" fill="#4f5d75">ONE PER FRAME</text>
          <rect x="394" y="252" width="84" height="12" fill="#f5f5f5"/><text x="436" y="261" fill="#4f5d75">PROMPTS + REFS</text>
          <rect x="626" y="252" width="84" height="12" fill="#f5f5f5"/><text x="668" y="261" fill="#4f5d75">PICK + VERIFY</text>
          <rect x="858" y="252" width="84" height="12" fill="#f5f5f5"/><text x="900" y="261" fill="#eb6c36">WATCH + "OK"</text>
          <rect x="792" y="342" width="80" height="12" fill="#f5f5f5"/><text x="832" y="351" fill="#4f5d75">WRITES BACK</text>
        </g>

        <!-- Research: scan -->
        <rect x="20" y="72" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="20" y="72" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="28" y="80" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="38" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">R1</text>
        <text x="88" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scan</text>
        <text x="88" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sources.md</text>
        <text x="88" y="144" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trends · what performed</text>

        <!-- Research: brief -->
        <rect x="252" y="72" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="252" y="72" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="260" y="80" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="270" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">R2</text>
        <text x="320" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Brief</text>
        <text x="320" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">brief.md</text>
        <text x="320" y="144" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">audience · one message</text>

        <!-- Honesty callout in the empty top-right: what is proposed vs proven. -->
        <g font-family="'Instrument Serif', serif" font-style="italic" font-size="15" fill="#4f5d75">
          <text x="484" y="104">The same pipeline that built the lens story, pointed at image and video.</text>
          <text x="484" y="126">Research and the generator stage are proposed, not yet run;</text>
          <text x="484" y="148">the checks between stages are the part already proven.</text>
        </g>

        <!-- 01 message -->
        <rect x="20" y="232" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="20" y="232" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="28" y="240" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="38" y="249" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
        <text x="88" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Message</text>
        <text x="88" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">post-script.md</text>
        <text x="88" y="304" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the hook, one caption</text>

        <!-- 02 shot list -->
        <rect x="252" y="232" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="252" y="232" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="260" y="240" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="270" y="249" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
        <text x="320" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shot list</text>
        <text x="320" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shots.md</text>
        <text x="320" y="304" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prompt + ref per frame</text>

        <!-- 03 generate -->
        <rect x="484" y="232" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="484" y="232" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="492" y="240" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="502" y="249" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
        <text x="552" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generate</text>
        <text x="552" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">image / video model</text>
        <text x="552" y="304" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">several takes per shot</text>

        <!-- 04 review (focal) -->
        <rect x="716" y="232" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="232" width="136" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="724" y="240" width="20" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="734" y="249" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
        <text x="784" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review</text>
        <text x="784" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">review.md · verdict.md</text>
        <text x="784" y="304" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">message · brand · flaws</text>

        <!-- 05 publish -->
        <rect x="948" y="232" width="136" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="948" y="232" width="136" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="956" y="240" width="20" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="966" y="249" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
        <text x="1016" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Publish</text>
        <text x="1016" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weekly batch</text>
        <text x="1016" y="304" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weekly goal count met</text>

        <!-- Back end: brand rules + prompt library, read by every stage (layout says so; no seven arrows). -->
        <rect x="20" y="376" width="1064" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="20" y="376" width="1064" height="56" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <text x="552" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Back end: brand rules, a prompt library and style references — read by every stage, improved by each review</text>
        <text x="552" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">brand.md · prompts/ · refs/ · a contract per stage, the same idea as the story pipeline's CONTEXT.md × 5</text>

        <!-- Legend: one horizontal strip -->
        <line x1="20" y1="456" x2="1084" y2="456" stroke="#bfc0c0" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" letter-spacing="0.04em">
          <rect x="20" y="472" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
          <text x="44" y="482">THE CHECK THAT DECIDES A SHIP</text>
          <line x1="352" y1="478" x2="388" y2="478" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="396" y="482">ARROW LABEL = WHAT PASSES THE STAGE</text>
          <line x1="712" y1="478" x2="748" y2="478" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="756" y="482">DOWN = REVIEW WRITES A RULE INTO THE BACK END</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
